name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish PKHeX-TRE
        run: dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj -c Release -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath PKHeX-TRE.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PKHeX-TRE
          path: PKHeX-TRE.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PKHeX-TRE.zip
          generate_release_notes: true
          prerelease: true
